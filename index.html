<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Bomb Defusal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    transition:0.5s;
}

h1{
    margin-bottom:20px;
    letter-spacing:4px;
}

.light{
    width:100px;
    height:100px;
    border-radius:50%;
    background:red;
    box-shadow:0 0 40px red;
    margin-bottom:30px;
    transition:0.5s;
}

.status{
    font-size:32px;
    margin-bottom:40px;
}

.buttons{
    display:flex;
    gap:20px;
}

button{
    width:120px;
    height:120px;
    font-size:28px;
    border:none;
    cursor:pointer;
    border-radius:12px;
}

.success{
    background:#001f3f;
}

.success .light{
    background:#222;
    box-shadow:none;
}

.success .status{
    color:#66ccff;
}

.fail{
    animation:flash 0.25s infinite;
}

@keyframes flash{
    0%{
        background:#330000;
    }
    50%{
        background:#ff0000;
    }
    100%{
        background:#330000;
    }
}
</style>
</head>

<body>

<div class="light"></div>

<div class="status" id="status">
    ARMED
</div>

<div class="buttons">
    <button onclick="success()">〇</button>
    <button onclick="fail()">〇</button>
    <button onclick="fail()">〇</button>
    <button onclick="fail()">〇</button>
</div>

<script>
function success(){

    document.body.classList.remove("fail");
    document.body.classList.add("success");

    document.getElementById("status").textContent =
        "DEFUSED";

    disableButtons();
}

function fail(){

    document.body.classList.remove("success");
    document.body.classList.add("fail");

    document.getElementById("status").textContent =
        "FAILED";

    disableButtons();
}

function disableButtons(){
    document.querySelectorAll("button").forEach(btn=>{
        btn.disabled=true;
    });
}
</script>

</body>
</html>
